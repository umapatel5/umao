name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: "Deploy AWS infrastructure after validation. Requires explicit approval and configured secrets."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install runner compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ python3

      - name: Start local runner service
        run: |
          RUNNER_SHARED_TOKEN=ci-runner-token node runner-service/server.mjs > runner.log 2>&1 &
          echo $! > runner.pid
          sleep 3

      - name: Test
        env:
          CODE_RUNNER_TEST_URL: http://127.0.0.1:8080/run
          CODE_RUNNER_SERVICE_TOKEN: ci-runner-token
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build runner Docker image
        run: docker build -f runner-service/Dockerfile -t umao-code-runner:${{ github.sha }} .

      - name: Upload runner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-log
          path: runner.log

  deploy_aws:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_aws == 'true'
    environment: production
    steps:
      - name: Deployment intentionally gated
        run: |
          echo "AWS deployment is gated behind manual workflow_dispatch approval."
          echo "Configure AWS credentials, ECR, ECS cluster, private networking, and secrets before enabling real deployment steps."
