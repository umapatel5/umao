name: CI
on:
  push:
    branches: [main, "release/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umao_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: umao_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U umao_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://umao_test:local-test-only@127.0.0.1:5432/umao_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:webcam
      - run: npm run test:postgres
      - run: npm run build
      - run: docker build -f runner-service/Dockerfile.sandbox -t umao-sandbox:local .
      - name: API integration and local benchmark
        run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-api-measurements
          path: artifacts/local-benchmark.json
  isolated-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f runner-service/Dockerfile.sandbox -t umao-sandbox:local .
      - name: Start isolated supervisor
        run: |
          NODE_ENV=production RUNNER_SHARED_TOKEN=local-dev-runner-token RUNNER_SANDBOX_IMAGE=umao-sandbox:local node runner-service/server.mjs > /tmp/umao-runner.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          cat /tmp/umao-runner.log
          exit 1
      - run: npm run test:runner
      - run: npm run test:problems
      - run: npm run test:runner-security
      - name: Supervisor diagnostics
        if: failure()
        run: cat /tmp/umao-runner.log
